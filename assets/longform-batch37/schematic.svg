<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="title desc"><title id="title">Fictional six-area category schematic</title><desc id="desc">Invented rectangles, not Pittsburgh and not to scale. A ten percent, B thirty, C one hundred, D twenty-five, E zero. F has no supplied value and is hatched. Exact values are also provided in the adjacent table.</desc><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fff"/><path d="M0 10L10 0" stroke="#555" stroke-width="2"/></pattern></defs><rect width="780" height="510" fill="#faf9f6"/><g font-family="sans-serif" fill="#162b3d"><text x="30" y="35" font-size="24">FICTIONAL SCHEMATIC — NOT PITTSBURGH</text><text x="30" y="65" font-size="18">Not to scale. Authored teaching figures only.</text><rect x="30" y="90" width="225" height="125" fill="#e2eef5" stroke="#263c4c" stroke-width="2"/><rect x="42" y="125" width="200" height="60" fill="#e2eef5"/><text x="52" y="150" font-size="23" fill="#162b3d">A: 10%</text><rect x="275" y="90" width="225" height="125" fill="#9dc3dd" stroke="#263c4c" stroke-width="2"/><rect x="287" y="125" width="200" height="60" fill="#9dc3dd"/><text x="297" y="150" font-size="23" fill="#162b3d">B: 30%</text><rect x="520" y="90" width="225" height="125" fill="#174c6b" stroke="#263c4c" stroke-width="2"/><rect x="532" y="125" width="200" height="60" fill="#174c6b"/><text x="542" y="150" font-size="23" fill="#fff">C: 100%</text><rect x="30" y="235" width="225" height="125" fill="#9dc3dd" stroke="#263c4c" stroke-width="2"/><rect x="42" y="270" width="200" height="60" fill="#9dc3dd"/><text x="52" y="295" font-size="23" fill="#162b3d">D: 25%</text><rect x="275" y="235" width="225" height="125" fill="#e2eef5" stroke="#263c4c" stroke-width="2"/><rect x="287" y="270" width="200" height="60" fill="#e2eef5"/><text x="297" y="295" font-size="23" fill="#162b3d">E: 0%</text><rect x="520" y="235" width="225" height="125" fill="url(#hatch)" stroke="#263c4c" stroke-width="2"/><rect x="532" y="270" width="200" height="60" fill="#fff"/><text x="542" y="295" font-size="18" fill="#162b3d">F: Not supplied</text><text x="30" y="410" font-size="18">Legend: pale = less than 25%; medium = 25% to less than 50%.</text><text x="30" y="442" font-size="18">Dark = 50% or greater; hatching = no supplied value.</text><text x="30" y="478" font-size="16">Categories do not identify real people, outcomes or places.</text></g></svg>